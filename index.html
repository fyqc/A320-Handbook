<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airbus A320/A321 Mobile Tech Reference</title>
    <style>
        :root {
            --primary: #00205b;       /* Airbus 经典深蓝 */
            --secondary: #0072ce;     /* 航空亮蓝 */
            --accent: #e4002b;        /* 警戒红 */
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 2px 6px rgba(0, 32, 91, 0.06);
        }

        [data-theme="dark"] {
            --primary: #0f172a;
            --secondary: #38bdf8;
            --bg-body: #090d16;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 50px;
            transition: background-color 0.2s, color 0.2s;
        }

        /* 顶部导航 */
        header {
            background-color: var(--primary);
            color: #fff;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .header-title { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.4px; }
        .badge { background: var(--secondary); color: #fff; font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .theme-btn {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #fff;
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
        }

        /* 全局搜索栏 */
        .search-bar {
            background: var(--bg-card);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 48px;
            z-index: 90;
        }
        .search-box {
            max-width: 820px;
            margin: 0 auto;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 10px 36px 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--bg-body);
            color: var(--text-main);
            outline: none;
        }
        .search-input:focus { border-color: var(--secondary); }
        .clear-search {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); font-size: 1.1rem;
            cursor: pointer; display: none;
        }

        .container { max-width: 820px; margin: 0 auto; padding: 16px; }

        /* 首页 7 大核心模块（严格还原 airbusHome.php） */
        .home-banner {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
        }
        .home-banner h2 { font-size: 1rem; margin-bottom: 4px; color: var(--secondary); }
        .home-banner p { font-size: 0.82rem; color: var(--text-muted); }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
        .module-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 12px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.12s, border-color 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
        }
        .module-card:hover { border-color: var(--secondary); transform: translateY(-2px); }
        .module-icon { font-size: 1.8rem; }
        .module-title { font-weight: 700; font-size: 0.92rem; }
        .module-count { font-size: 0.74rem; color: var(--text-muted); background: var(--bg-body); padding: 2px 8px; border-radius: 10px; }

        /* 列表头部与返回按钮 */
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--secondary);
        }
        .view-title { font-size: 1.05rem; font-weight: 700; color: var(--secondary); }
        .btn-back {
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 5px 12px; border-radius: 6px;
            font-size: 0.85rem; cursor: pointer; font-weight: 600;
        }

        /* 字母快捷索引条（专用于 Acronyms） */
        .alpha-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 12px;
            background: var(--bg-card);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .alpha-btn {
            padding: 4px 8px;
            font-size: 0.78rem;
            font-weight: 700;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-main);
            border-radius: 4px;
            cursor: pointer;
        }
        .alpha-btn.active { background: var(--secondary); color: #fff; border-color: var(--secondary); }

        /* 列表项卡片 */
        .list-group { display: flex; flex-direction: column; gap: 8px; }
        .list-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .list-item:hover { border-color: var(--secondary); }
        .item-left { display: flex; flex-direction: column; gap: 2px; }
        .item-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; color: var(--secondary); font-size: 0.95rem; }
        .item-name { font-size: 0.9rem; color: var(--text-main); }
        .item-badge {
            font-size: 0.72rem; padding: 3px 8px; border-radius: 6px;
            background: var(--bg-body); color: var(--text-muted); white-space: nowrap; flex-shrink: 0;
        }

        /* 详情弹窗 */
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: none; justify-content: center; align-items: flex-end; z-index: 200;
        }
        .modal-backdrop.show { display: flex; }
        .modal-box {
            background: var(--bg-card); width: 100%; max-width: 760px; max-height: 85vh;
            border-radius: 16px 16px 0 0; padding: 20px; overflow-y: auto;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
        }
        @media (min-width: 640px) {
            .modal-backdrop { align-items: center; }
            .modal-box { border-radius: 12px; width: 92%; }
        }
        .modal-top { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px; }
        .modal-close { background: none; border: none; font-size: 1.6rem; color: var(--text-muted); cursor: pointer; line-height: 1; }
        .modal-body { font-size: 0.94rem; white-space: pre-line; line-height: 1.6; }
        .ref-tag {
            margin-top: 14px; padding: 10px 12px; border-left: 4px solid var(--secondary);
            background: rgba(0, 114, 206, 0.08); font-size: 0.84rem; border-radius: 0 6px 6px 0;
        }

        footer {
            text-align: center; margin-top: 32px; padding: 16px;
            font-size: 0.78rem; color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
        footer strong { color: var(--accent); }
    </style>
</head>

</div>

// 解析 RAW_ACRONYMS 为标准对象数组
const ACRONYM_ITEMS = RAW_ACRONYMS.trim().split('\n').map(line => {
    const idx = line.indexOf(' - ');
    const code = idx > -1 ? line.slice(0, idx).trim() : line.trim();
    const title = idx > -1 ? line.slice(idx + 3).trim() : '';
    return {
        mod: 'acronyms',
        code: code,
        title: title,
        tag: 'Acronym',
        source: 'airbus/Acronyms/acronyms.html',
        detail: `${code} — ${title}`
    };
});

// 合并所有数据
const ALL_DATA = [...STATIC_ITEMS, ...ACRONYM_ITEMS];

// =========================================================================
// 4. 界面渲染与交互控制
// =========================================================================
let activeModule = null;
let activeLetter = 'ALL';

function initApp() {
    const grid = document.getElementById('moduleGrid');
    grid.innerHTML = MODULES.map(m => {
        const count = ALL_DATA.filter(i => i.mod === m.id).length;
        return `
            <div class="module-card" onclick="openModule('${m.id}')">
                <div class="module-icon">${m.icon}</div>
                <div class="module-title">${m.title}</div>
                <div class="module-count">${count} 条目</div>
            </div>
        `;
    }).join('');
}

function goHome() {
    activeModule = null;
    activeLetter = 'ALL';
    document.getElementById('searchInput').value = '';
    document.getElementById('clearBtn').style.display = 'none';
    document.getElementById('homeView').style.display = 'block';
    document.getElementById('listView').style.display = 'none';
}

function openModule(modId) {
    activeModule = modId;
    activeLetter = 'ALL';
    document.getElementById('searchInput').value = '';
    document.getElementById('clearBtn').style.display = 'none';

    const modInfo = MODULES.find(m => m.id === modId);
    document.getElementById('viewTitle').textContent = `${modInfo.icon} ${modInfo.title}`;
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';

    // 如果是缩略语模块，显示 A-Z 字母筛选栏
    const alphaBar = document.getElementById('alphaFilter');
    if (modId === 'acronyms') {
        alphaBar.style.display = 'flex';
        renderAlphaBar();
    } else {
        alphaBar.style.display = 'none';
    }

    renderFilteredList();
}

function renderAlphaBar() {
    const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), '0-9'];
    document.getElementById('alphaFilter').innerHTML = letters.map(l => `
        <button class="alpha-btn ${activeLetter === l ? 'active' : ''}" onclick="filterByLetter('${l}')">${l}</button>
    `).join('');
}

function filterByLetter(letter) {
    activeLetter = letter;
    renderAlphaBar();
    renderFilteredList();
}

function renderFilteredList() {
    let items = ALL_DATA.filter(i => i.mod === activeModule);
    if (activeModule === 'acronyms' && activeLetter !== 'ALL') {
        items = items.filter(i => {
            const first = i.code.charAt(0).toUpperCase();
            if (activeLetter === '0-9') return /[0-9]/.test(first);
            return first === activeLetter;
        });
    }
    renderList(items);
}

function onSearch() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    document.getElementById('clearBtn').style.display = q ? 'block' : 'none';

    if (!q) {
        if (activeModule) openModule(activeModule);
        else goHome();
        return;
    }

    document.getElementById('homeView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    document.getElementById('alphaFilter').style.display = 'none';
    document.getElementById('viewTitle').textContent = `🔍 搜索结果: "${q}"`;

    const matches = ALL_DATA.filter(i =>
        i.code.toLowerCase().includes(q) ||
        i.title.toLowerCase().includes(q) ||
        i.detail.toLowerCase().includes(q)
    );
    renderList(matches);
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    onSearch();
}

function renderList(items) {
    const container = document.getElementById('itemsContainer');
    if (items.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">未找到匹配的条目</div>`;
        return;
    }
    container.innerHTML = items.map(item => {
        const idx = ALL_DATA.indexOf(item);
        return `
            <div class="list-item" onclick="showDetail(${idx})">
                <div class="item-left">
                    <span class="item-code">${item.code}</span>
                    <span class="item-name">${item.title}</span>
                </div>
                <span class="item-badge">${item.tag}</span>
            </div>
        `;
    }).join('');
}

function showDetail(index) {
    const item = ALL_DATA[index];
    document.getElementById('mCode').textContent = item.code;
    document.getElementById('mTitle').textContent = item.title;
    document.getElementById('mDesc').textContent = item.detail;
    document.getElementById('mPath').textContent = `📁 原站档案路径映射: ${item.source}`;
    document.getElementById('modal').classList.add('show');
}

function closeModal(e) {
    if (!e || e.target.id === 'modal') {
        document.getElementById('modal').classList.remove('show');
    }
}

function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById('themeBtn');
    if (body.getAttribute('data-theme') === 'dark') {
        body.removeAttribute('data-theme');
        btn.textContent = '🌙 夜间模式';
    } else {
        body.setAttribute('data-theme', 'dark');
        btn.textContent = '☀️ 日间模式';
    }
}

initApp();
</script>
